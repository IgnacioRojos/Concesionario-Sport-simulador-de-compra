<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../assets/img/auto.jpg" />
  <title>Concesionario Sport</title>

  <!-- Bootstrap + SweetAlert -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/estilo.css" />

  <!-- Scripts para conexion de base de datos -->
  <script  type="module" src="../js/script.js" ></script>

</head>

<body>
  <main class="container py-4">
    <!-- NAVBAR -->
    <header class="mb-4">
      <nav class="navbar bg-white shadow rounded p-3">
        <div class="container justify-content-center">
          <a class="navbar-brand" href="#">
            <img src="../assets/img/auto.jpg" alt="Logo concesionario" width="120" height="120" class="rounded" />
          </a>
        </div>
      </nav>
    </header>

    <!-- BOTONES SUPERIORES -->
    <section class="row mb-3">
      <div class="col text-end">
        <button id="botonSalida" class="btn btn-outline-danger me-2" title="Salir">
          <img src="../assets/img/icono salida.jpg" alt="Salir" width="24" />
        </button>
        <button id="botonMuestra" class="btn btn-outline-info">¿Olvidó sus datos?</button>
      </div>
    </section>

    <!-- SALUDO Y DATOS -->
    <section class="row mb-4">
      <div class="col">
        <div id="saludo" class="mb-3"></div>
        <div id="datos"></div>
      </div>
    </section>

    <!-- DESCRIPCIÓN -->
    <section class="row mb-4 text-center">
      <div class="col">
        <h2 class="fw-bold">Simulador de Concesionario</h2>
        <p class="lead">Trabajamos con las marcas Fiat, Renault, Chevrolet y VW.</p>
      </div>
    </section>

    <!-- BUSCADOR -->
    <section class="row mb-4">
      <div class="col">
        <form class="d-flex flex-column flex-md-row gap-2" role="search">
          <input id="marca" type="search" class="form-control" placeholder="Buscar precio según marca" />
          <button id="botonSearch" type="button" class="btn btn-outline-success">Buscar</button>
        </form>
        <div id="muestroPrecio" class="mt-3"></div>
      </div>
    </section>

    <!-- CÁLCULO DE SEGURO -->
    <section class="row mb-4">
      <div class="col text-center">
        <button id="botonSeguro" class="btn btn-success">Calcular Seguro</button>
      </div>
    </section>

    <!-- KILÓMETROS -->
    <section class="row mb-4 text-center">
      <div class="col">
        <h3 class="mb-3">¿Quiere saber cuánto gasta su auto? Elija la marca:</h3>
        <div class="d-flex flex-wrap justify-content-center gap-2">
          <button id="fiat" class="btn btn-warning">Fiat</button>
          <button id="vw" class="btn btn-warning">Volkswagen</button>
          <button id="renault" class="btn btn-warning">Renault</button>
          <button id="chevrolet" class="btn btn-warning">Chevrolet</button>
        </div>
        <div id="listadoKilometros" class="mt-3"></div>
      </div>
    </section>

    <!-- CARDS DE AUTOS -->
    <section class="row mb-4" id="contenedorCards">
      <!-- Las cards se insertarán aquí desde JS -->
    </section>

    <!-- CARRITO -->
    <section class="row">
      <h2 class="titulo-carro">Carrito:</h2>
      <div id="carrito" class="col">
        <!-- Contenido del carrito desde JS -->
      </div>
    </section>
  </main>

  <!-- Scripts Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>


</body>
</html>
