<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/img/auto.jpg" />
  <title>Iniciar sesión - Concesionario Sport</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">

  <script defer type="module" src="./js/main.js" ></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
  <main class="container">
    <section class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow p-4">
          <h2 class="text-center mb-4">Iniciar sesión</h2>

          <div class="form-group mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input id="usuario" type="text" class="form-control" placeholder="Ingrese su usuario" />
          </div>

          <div class="form-group mb-3 position-relative">
            <label for="contraseña" class="form-label">Contraseña</label>
            <input id="contraseña" type="password" class="form-control" placeholder="Ingrese su contraseña" />
            <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2 mostrarContraseña" onclick="togglePassword()">👁</button>
          </div>

          <div id="mensajeError" class="alert alert-danger d-none mt-2" role="alert">
            Usuario o contraseña incorrectos.
          </div>

          <div class="d-grid mt-3">
            <button id="botonLogin" class="btn btn-primary">Iniciar sesión</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById("contraseña");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

</body>
</html>
